<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
      <link href="./output.css" rel="stylesheet">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
      <style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Sansita:ital,wght@0,400;0,700;0,800;0,900;1,400;1,700;1,800;1,900&family=Syne:wght@400..800&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Commissioner:wght@100..900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Jost:ital,wght@0,100..900;1,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Outfit:wght@100..900&family=Pliant:ital,wght@0,100..900;1,100..900&family=Sansita:ital,wght@0,400;0,700;0,800;0,900;1,400;1,700;1,800;1,900&family=Syne:wght@400..800&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');
</style>
</head>
<body class="bg-[#F5F2ED] dark:bg-black">
    <nav class="bg-white dark:bg-[#181818] sm:h-25  p-2 h-22 w-full flex justify-between">
<!-- logo -->
<div class="lg:h-22 lg:w-58 md:h-20 md:w-40 sm:h-20 sm:w-35 h-18 w-30  py-4 flex">
<img src="/images/new-logo.png" class="object-cover sm:h-15 sm:w-15 h-10 w-10   rounded-2xl">
<!-- logo name -->
 <div class="flex flex-col justify-center ml-1 py-2">
 <span class="sm:text-xl text-sm font-extrabold font-['Syne'] dark:text-[#e0e0e0]">TaskFlow</span>
 <!-- sec info -->
  <span class="sm:text-[10px] text-[8px] font-semibold text-[#A38763] font-['Outfit']">ORGANIZE•PRIORITIZE•DONE.</span>
  </div>
</div>
<!-- right section date / darkmode -->
 <div class="flex items-center p-2">
<div class="flex">
    <span class="mt-2 text-[#828282] mr-4 sm:text-lg text-[12px]">Saturday,June 13 2026</span>
   <div class=" h-10 w-10 bg-[#F5F2ED]  hover:text-white hover:bg-[black]  flex items-center justify-center rounded-2xl"><i class="fa-solid fa-moon darkmodebtn"></i>
    </div> 
</div>
 </div>
</nav>
<div class="lg:grid lg:grid-cols-4 lg:gap-20 w-full my-4 xl:px-20 md:px-15 gap-4 grid grid-cols-2 px-8">
    <!-- 1 -->
  <div class="bg-black dark:bg-[#9A8061]  h-40 w-full hover:bg-[#2b2b2b] duration-300 rounded-2xl">
<div class="w-full h-full p-3  flex flex-col justify-around  ">
<div class="h-9 w-9  bg-[#404040] flex items-center justify-center rounded-xl"> 
<i class="fa-solid fa-list-check text-white"></i>
</div>
<div class="flex flex-col w-full">
    <span class="text-xl font-['Syne'] text-[#828282] dark:text-white">Total tasks</span>
    <span id="totaltasks" class="text-3xl text-white font-semibold font-['Syne'] dark:text-[#e0e0e0]"></span>
</div>
</div>
  </div>
  <!-- 2 -->
  <div class="bg-white dark:bg-[#303030] h-40 w-full hover:bg-[#F8F8F8] duration-300 rounded-2xl">
<div class="w-full h-full p-3  flex flex-col justify-around  ">
<div class="h-9 w-9  bg-[#77b67957] flex items-center justify-center rounded-xl"> 
<i class="fa-solid fa-check text-green-500"></i>
</div>
<div class="flex flex-col w-full">
    <span class="text-xl font-['Syne'] text-[#828282]">Completed</span>
    <span id="completed" class="text-3xl text-black font-semibold font-['Syne'] dark:text-[#e0e0e0]">7</span>
</div>
</div>
  </div>
  <!-- 3 -->
    <div class="bg-white dark:bg-[#303030] h-40 w-full hover:bg-[#F8F8F8] duration-300 rounded-2xl">
<div class="w-full h-full p-3  flex flex-col justify-around  ">
<div class="h-9 w-9  bg-[#f59f0b91] flex items-center justify-center rounded-xl"> 
<i class="fa-regular fa-clock text-amber-500"></i>
</div>
<div class="flex flex-col w-full">
    <span class="text-xl font-['Syne'] text-[#828282]">Pending</span>
    <span id="pendingtasks" class="text-3xl text-black font-semibold font-['Syne'] dark:text-[#e0e0e0]">5</span>
</div>
</div>
  </div>
  <!-- 4 -->
  <div class="bg-white dark:bg-[#303030] h-40 w-full rounded-2xl hover:bg-[#F8F8F8] duration-300">
<div class="w-full h-full p-3  flex flex-col justify-around  ">
<div class="h-9 w-9  bg-[#8a5cf68c] flex items-center justify-center rounded-xl"> 
<i class="fa-solid fa-chart-pie text-violet-500"></i>
</div>
<div class="flex flex-col w-full ">
    <span class="text-xl font-['Syne'] text-[#828282]">Completion</span>
    <span id="completionper" class="text-3xl text-black font-semibold font-['Syne'] dark:text-[#e0e0e0]">0%</span>
</div>
</div>
  </div>
</div>
 </div>
 <!-- white task bar  -->
  <div class="w-[90%]   mx-auto my-10 rounded-2xl md:flex md:flex-row flex flex-col gap-5 dark:bg-[#303030]  p-5 bg-white">
<!-- input -->
 <div class="md:w-140 h-15 w-full mx-auto flex justify-between hover:bg-[#F8F8F8] dark:hover:bg-[#000000]  duration-300  rounded-2xl">
  <input id="taskinput" type="text" class="h-full text-xl w-full rounded-2xl focus:outline-none px-2 font-['Syne'] border-gray-300 dark:text-white border-2"  placeholder="What needs to be done?">
 </div>
  <!--select options  -->
 <div class="flex gap-4 md:w-140 w-full   md:mx-5">
  <select id="taskcat" class="flex-1 p-3 text-xl hover:bg-[#F8F8F8] duration-300 dark:hover:bg-[#000000]  rounded-xl focus:outline-none dark:text-white font-['Syne'] border-gray-300 border-2">
    <option>Personal</option>
    <option>Work</option>
    <option>Study</option>
   
  </select>

  <select id="tasklvl" class="flex-1 text-xl p-3 dark:text-white hover:bg-[#F8F8F8] dark:hover:bg-[#000000]  duration-300 rounded-xl focus:outline-none font-['Syne'] border-gray-300 border-2">
    <option>High</option>
    <option>Medium</option>
    <option>Low</option>
  </select>
</div>
<!-- add task -->
<div class="md:w-60 h-15 w-full hover:bg-[#F8F8F8] dark:hover:bg-[#000000] duration-300  rounded-2xl border-2 border-gray-300 flex justify-center items-center">
  <button id="taskadd" class="lg:text-xl text-md duration-300 hover:scale-110 transition h-full w-full rounded-2xl dark:text-white"><i class="fa-solid fa-plus dark:text-white"></i> Add Task</button>
</div>
  </div>
  <!-- main section -->



   <section class="w-[90%] sm:p-5 mx-auto lg:flex lg:flex-row flex flex-col gap-5 justify-between  rounded-2xl mb-5">
<!-- left section -->
 <div class="lg:w-[55%] w-full h-full bg-white dark:bg-[#303030] relative rounded-2xl hide-scrollbar overflow-y-auto  ">
<!-- top bar -->
 <div class="h-13 p-8 w-full flex justify-between sticky top-0 dark:bg-[#303030] z-50 pl-0 items-center  bg-white">
<!-- name  my tasks-->
 <div class="sm:text-2xl text-xl dark:text-white font-bold ml-4 font-['Syne']">
  My Tasks
 </div>
 <!-- 3 buttons -->

 </div>
 <!-- task div -->
  <div class="w-full h-90 p-3.5  ">
<!-- task list  -->
 
 <!--  -->
<!-- all added task after this -->

  <div id="allTasks">

  </div>


 
  </div>
 </div>
<!--  -->
<!-- wrapper for both boxes -->
  <div class="flex flex-col lg:w-[40%] w-full gap-4  rounded-2xl ">
     <!-- the progress bar -->
  <div class="h-45  rounded-2xl bg bg-white dark:bg-[#303030] p-5 font-semibold ">
<!-- todays progress -->
 <h3 class="text-3xl font-['Syne'] dark:text-[#e0e0e0]">
  Today's Progress
 </h3>
 <!-- progress bar div -->
  <div class=" mt-4 h-[70%] p-5 pl-0 w-full">
<!-- bar -->
 <div class="bg-[#F0EDE7] w-full h-5 rounded-2xl">
<div id="probar" class="bg-[#9A8061] h-full w-[50%] rounded-2xl">

</div>
 </div>
 <!-- number of bars -->
  <div class="h-5 w-full  mt-1 flex justify-between">
<span id="belowprobar" class="font-['Jost']  font-medium dark:text-[#e0e0e0] text-[#808080cc]">
  7 of 12 done
</span>
<span id="belowprobarpercentage" class="font-['Jost'] font-medium dark:text-[#e0e0e0] text-[#808080cc]">
  50%
</span>
  </div>
  </div>
  </div>
<!-- the category box -->
 <div class="h-55  rounded-2xl bg-white dark:bg-[#303030]  p-5 ">
<h4 class="text-3xl font-['Syne'] dark:text-[#e0e0e0] font-semibold">
  By Category
</h4>
<!-- category container -->
 <div class="h-[80%] w-full   py-1 mt-2">
<!-- 3 divs to contain names -->
 <!-- 1 -->
  <div class="h-[30%] w-full border-b-2 border-gray-200 text-xl font-['syne'] dark:text-[#e0e0e0] text-[#828282] flex justify-between items-center">
    <span>
<i class="fa-solid fa-circle-dot  text-green-500 text-[14px] mr-1"></i>Study
    </span>
    <span id="studytask" >
0 Tasks      
    </span>
  </div>
  <!-- 2 -->
   <div class="h-[30%] w-full border-b-2 dark:text-[#e0e0e0] border-gray-200  text-xl font-['syne'] text-[#828282] flex justify-between items-center">
    <span>
<i class="fa-solid fa-circle-dot text-[#9A8061] text-[14px] mr-1"></i>Work
    </span>
    <span id="worktask">
0 Tasks      
    </span>
  </div>
   <!-- 3 -->
   <div class="h-[30%] w-full dark:text-[#e0e0e0]  text-xl font-['syne'] text-[#828282] flex justify-between items-center">
    <span>
<i class="fa-solid fa-circle-dot text-orange-400 text-[14px] mr-1"></i>Personal
    </span>
    <span id="personaltask">
0 Tasks      
    </span>
  </div>
 </div>
 </div>

</div>


   </section>
   <script src="script.js"></script>

</body>
</html>
